<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble Sort Animation</title>
<style>
  :root{
    --bg: #ffffff;
    --bar: #111111;
    --text: #111111;
    --muted: #8a8a8a;
    color-scheme: light;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
  }

  .legend{ display:flex; gap: 16px; font-size: 0.7rem; color: var(--muted); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .swatch{ width: 10px; height: 10px; background: var(--bar); }
  .swatch.unsorted{ opacity: 0.35; }

  .status{ font-size: 0.85rem; color: var(--muted); }
  .status b{ color: var(--text); }

  .chart{
    position: relative;
    height: 200px;
  }
  .bar-wrap{
    position: absolute;
    left: 0;
    bottom: 0;
    width: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: transform 0.5s cubic-bezier(.4,0,.2,1);
  }
  .bar{
    width: 36px;
    background: var(--bar);
    transition: opacity 0.3s ease;
  }
  .value{ font-size: 0.85rem; font-weight: 600; }

  .markers{
    position: relative;
    height: 16px;
  }
  .marker{
    position: absolute;
    top: 0;
    width: 36px;
    text-align: center;
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text);
    transition: transform 0.5s cubic-bezier(.4,0,.2,1), opacity 0.3s ease;
    opacity: 0;
  }
  .marker.visible{ opacity: 1; }

  .controls{ display: flex; gap: 18px; }

  button{
    border: none;
    background: none;
    color: var(--text);
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  button:disabled{ opacity: 0.35; cursor: not-allowed; }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111111; --bar:#f2f2f2; --text:#f2f2f2; --muted:#8a8a8a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111111; --bar:#f2f2f2; --text:#f2f2f2; --muted:#8a8a8a;
    color-scheme: dark;
  }
</style>
</head>
<body>
  <div class="legend">
    <span><i class="swatch"></i> sortiert</span>
    <span><i class="swatch unsorted"></i> unsortiert</span>
  </div>

  <div class="status">swap = <b id="swapValue">–</b></div>

  <div class="chart" id="chart"></div>

  <div class="markers" id="markers">
    <div class="marker" id="markerI">i</div>
    <div class="marker" id="markerI2">i+1</div>
  </div>

  <div class="controls">
    <button id="change">Werte ändern</button>
    <button id="play">Play</button>
  </div>

<script>
(function(){
  const N = 7;
  const BAR_WIDTH = 36;
  const GAP = 14;
  const COLUMN = BAR_WIDTH + GAP;
  const STEP_MS = 900;
  const maxHeight = 160;

  const chart = document.getElementById('chart');
  const markersEl = document.getElementById('markers');
  const changeBtn = document.getElementById('change');
  const playBtn = document.getElementById('play');
  const markerI = document.getElementById('markerI');
  const markerI2 = document.getElementById('markerI2');
  const swapValueEl = document.getElementById('swapValue');

  const totalWidth = N * BAR_WIDTH + (N - 1) * GAP;
  chart.style.width = totalWidth + 'px';
  markersEl.style.width = totalWidth + 'px';

  // bars: eine feste Objekt-Identität pro Wert, "slot" = aktuelle Position im Array.
  const bars = [];
  for(let i = 0; i < N; i++){
    const wrap = document.createElement('div');
    wrap.className = 'bar-wrap';
    const valueLabel = document.createElement('div');
    valueLabel.className = 'value';
    const bar = document.createElement('div');
    bar.className = 'bar';
    wrap.appendChild(valueLabel);
    wrap.appendChild(bar);
    chart.appendChild(wrap);
    bars.push({ wrap, bar, valueLabel, value: 0 });
  }

  let order = bars.slice(); // order[slot] = bar-Objekt an dieser Position

  function randomArray(n){
    const set = new Set();
    while(set.size < n) set.add(Math.floor(Math.random() * 50) + 1);
    return Array.from(set);
  }

  function placeSlots(){
    order.forEach((barObj, slot) => {
      barObj.wrap.style.transform = `translateX(${slot * COLUMN}px)`;
    });
  }

  function setMarker(el, idx){
    if(idx === null || idx === undefined){
      el.classList.remove('visible');
      return;
    }
    el.style.transform = `translateX(${idx * COLUMN}px)`;
    el.classList.add('visible');
  }

  function applyFill(sortedFrom){
    order.forEach((barObj, slot) => {
      barObj.bar.style.opacity = slot >= sortedFrom ? '1' : '0.35';
    });
  }

  // idee: 1) swap-boolean merkt sich, ob getauscht wurde 2) größte Elemente wandern nach rechts
  // solange x < n-1 und swap:
  //   swap = false
  //   für i = 0 .. n-2-x:
  //     wenn z[i] > z[i+1] -> tauschen, swap = true
  function buildOps(values){
    const arr = values.slice();
    const n = arr.length;
    const ops = [];
    let x = 0;
    let swapFlag = true;
    while(x < n - 1 && swapFlag){
      swapFlag = false;
      for(let i = 0; i < n - 1 - x; i++){
        let swapped = false;
        if(arr[i] > arr[i + 1]){
          const tmp = arr[i]; arr[i] = arr[i + 1]; arr[i + 1] = tmp;
          swapFlag = true;
          swapped = true;
        }
        ops.push({ type: 'compare', x, i, swap: swapFlag, swapped });
      }
      x++;
    }
    ops.push({ type: 'done' });
    return ops;
  }

  function render(op){
    if(op.type === 'done'){
      setMarker(markerI, null);
      setMarker(markerI2, null);
      swapValueEl.textContent = 'false';
      applyFill(0);
      return;
    }
    setMarker(markerI, op.i);
    setMarker(markerI2, op.i + 1);
    swapValueEl.textContent = op.swap ? 'true' : 'false';
    applyFill(N - op.x);
    if(op.swapped){
      const a = order[op.i], b = order[op.i + 1];
      order[op.i] = b;
      order[op.i + 1] = a;
      placeSlots();
    }
  }

  function updateValues(array){
    array.forEach((val, idx) => {
      const barObj = bars[idx];
      barObj.value = val;
      barObj.valueLabel.textContent = val;
    });
    const maxVal = Math.max(...array);
    bars.forEach(barObj => {
      barObj.bar.style.height = Math.max(20, (barObj.value / maxVal) * maxHeight) + 'px';
    });
  }

  let playing = false;
  let currentArr = [];

  function changeValues(){
    if(playing) return;
    currentArr = randomArray(N);
    order = bars.slice();
    placeSlots();
    updateValues(currentArr);
    applyFill(N);
    setMarker(markerI, null);
    setMarker(markerI2, null);
    swapValueEl.textContent = '–';
  }

  function play(){
    if(playing) return;
    playing = true;
    playBtn.disabled = true;
    changeBtn.disabled = true;

    order = bars.slice();
    placeSlots();
    updateValues(currentArr);

    const ops = buildOps(currentArr);
    let idx = 0;
    function step(){
      if(idx >= ops.length){
        playing = false;
        playBtn.disabled = false;
        changeBtn.disabled = false;
        return;
      }
      render(ops[idx]);
      idx++;
      setTimeout(step, STEP_MS);
    }
    step();
  }

  changeBtn.addEventListener('click', changeValues);
  playBtn.addEventListener('click', play);

  changeValues();
})();
</script>
</body>
</html>
