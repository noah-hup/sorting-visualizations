<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binary Search Animation</title>
<style>
  :root{
    --bg: #ffffff;
    --bar: #111111;
    --bar-active: #b3b3b3;
    --text: #111111;
    --muted: #8a8a8a;
    color-scheme: light;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
  }

  .target{ font-size: 0.85rem; color: var(--muted); }
  .target b{ color: var(--text); }

  .chart{
    display: flex;
    align-items: flex-end;
    gap: 14px;
    height: 200px;
  }
  .bar-wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .bar{
    width: 36px;
    background: var(--bar);
    transition: background 0.4s ease;
  }
  .bar.active{ background: var(--bar-active); }
  .value{ font-size: 0.85rem; font-weight: 600; }

  .markers{
    position: relative;
    height: 60px;
  }
  .marker-row{
    position: absolute;
    left: 0;
    width: 100%;
    height: 16px;
  }
  .marker{
    position: absolute;
    top: 0;
    width: 36px;
    text-align: center;
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text);
    transition: transform 0.6s cubic-bezier(.4,0,.2,1), opacity 0.3s ease;
    opacity: 0;
  }
  .marker.visible{ opacity: 1; }

  button{
    border: none;
    background: var(--bar);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 10px 26px;
    border-radius: 999px;
    cursor: pointer;
  }
  button:disabled{ opacity: 0.35; cursor: not-allowed; }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111111; --bar:#f2f2f2; --bar-active:#5a5a5a; --text:#f2f2f2; --muted:#8a8a8a;
      color-scheme: dark;
    }
    :root:not([data-theme="light"]) button{ background: var(--bar); color:#111111; }
  }
  :root[data-theme="dark"]{
    --bg:#111111; --bar:#f2f2f2; --bar-active:#5a5a5a; --text:#f2f2f2; --muted:#8a8a8a;
    color-scheme: dark;
  }
  :root[data-theme="dark"] button{ background: var(--bar); color:#111111; }
</style>
</head>
<body>
  <div class="target">Suche nach <b id="targetLabel">–</b></div>
  <div class="chart" id="chart"></div>
  <div class="markers" id="markers">
    <div class="marker-row" style="top:0"><div class="marker" id="markerR">R</div></div>
    <div class="marker-row" style="top:20px"><div class="marker" id="markerM">M</div></div>
    <div class="marker-row" style="top:40px"><div class="marker" id="markerL">L</div></div>
  </div>
  <button id="play">▶ Play</button>

<script>
(function(){
  const N = 7;
  const BAR_WIDTH = 36;
  const GAP = 14;
  const COLUMN = BAR_WIDTH + GAP;
  const STEP_MS = 2200;
  const maxHeight = 160;

  const chart = document.getElementById('chart');
  const markersEl = document.getElementById('markers');
  const playBtn = document.getElementById('play');
  const targetLabel = document.getElementById('targetLabel');
  const markerR = document.getElementById('markerR');
  const markerM = document.getElementById('markerM');
  const markerL = document.getElementById('markerL');

  const totalWidth = N * BAR_WIDTH + (N - 1) * GAP;
  markersEl.style.width = totalWidth + 'px';

  const bars = [];
  for(let i = 0; i < N; i++){
    const wrap = document.createElement('div');
    wrap.className = 'bar-wrap';
    const valueLabel = document.createElement('div');
    valueLabel.className = 'value';
    const bar = document.createElement('div');
    bar.className = 'bar';
    wrap.appendChild(valueLabel);
    wrap.appendChild(bar);
    chart.appendChild(wrap);
    bars.push({ valueLabel, bar });
  }

  function randomSortedArray(n){
    const set = new Set();
    while(set.size < n) set.add(Math.floor(Math.random() * 50) + 1);
    return Array.from(set).sort((a, b) => a - b);
  }

  // l + (r-l)/2, gemäß:
  // solange l<=r:
  //   mitte = l + (r-l)/2
  //   gesucht == arr[mitte]  -> gefunden
  //   gesucht <  arr[mitte]  -> rechte Grenze = mitte-1
  //   gesucht >= arr[mitte]  -> linke Grenze  = mitte+1
  function buildSteps(array, target){
    const steps = [];
    let l = 0, r = array.length - 1;
    while(l <= r){
      const mitte = l + Math.floor((r - l) / 2);
      steps.push({ l, r, mitte });
      if(target === array[mitte]) break;
      else if(target < array[mitte]) r = mitte - 1;
      else l = mitte + 1;
    }
    return steps;
  }

  function setArray(array){
    const maxVal = Math.max(...array);
    array.forEach((val, idx) => {
      bars[idx].valueLabel.textContent = val;
      bars[idx].bar.style.height = Math.max(20, (val / maxVal) * maxHeight) + 'px';
      bars[idx].bar.classList.remove('active');
    });
  }

  function moveMarker(el, idx){
    el.style.transform = `translateX(${idx * COLUMN}px)`;
    el.classList.add('visible');
  }

  function render(step){
    bars.forEach(({ bar }, idx) => bar.classList.toggle('active', idx === step.mitte));
    moveMarker(markerR, step.r);
    moveMarker(markerM, step.mitte);
    moveMarker(markerL, step.l);
  }

  let playing = false;

  function play(){
    if(playing) return;
    playing = true;
    playBtn.disabled = true;
    [markerR, markerM, markerL].forEach(m => m.classList.remove('visible'));

    const arr = randomSortedArray(N);
    const target = arr[Math.floor(Math.random() * arr.length)];
    targetLabel.textContent = target;
    setArray(arr);

    const steps = buildSteps(arr, target);
    let i = 0;
    function step(){
      if(i >= steps.length){
        playing = false;
        playBtn.disabled = false;
        return;
      }
      render(steps[i]);
      i++;
      setTimeout(step, STEP_MS);
    }
    step();
  }

  playBtn.addEventListener('click', play);

  setArray(randomSortedArray(N));
})();
</script>
</body>
</html>
