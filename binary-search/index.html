<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binary Search Animation</title>
<style>
  :root{
    --bg: #f7f8fb;
    --panel: #ffffff;
    --border: #e2e5ec;
    --text: #1c2130;
    --muted: #6b7280;
    --accent: #4361ee;
    --accent-soft: #eef1ff;
    --low: #4361ee;
    --high: #f72585;
    --mid: #ffb703;
    --found: #2ec4b6;
    --eliminated: #dfe2ea;
    --eliminated-text: #a3a8b5;
    --box-bg: #fff;
    --box-border: #c7cde0;
    color-scheme: light;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    min-height: 100vh;
  }
  .wrap{ max-width: 900px; margin: 0 auto; }
  h1{ font-size: 1.25rem; margin: 0 0 4px; }
  .subtitle{ color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }

  .panel{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }

  .controls{ display:flex; flex-wrap:wrap; gap: 14px; align-items: flex-end; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  input[type=number]{
    width: 90px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--box-border);
    font-size: 0.95rem; background: #fff; color: var(--text);
  }
  input[type=range]{ width: 140px; }
  button{
    border: none; border-radius: 8px; padding: 9px 14px; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: transform 0.05s ease, opacity 0.15s ease;
  }
  button:active{ transform: scale(0.96); }
  button:disabled{ opacity: 0.4; cursor: not-allowed; }
  .btn-primary{ background: var(--accent); color: #fff; }
  .btn-secondary{ background: var(--accent-soft); color: var(--accent); }
  .btn-ghost{ background: transparent; color: var(--muted); border: 1px solid var(--border); }

  .playback{ display:flex; gap:8px; align-items:center; margin-top: 14px; flex-wrap: wrap; }
  .step-counter{ font-size: 0.85rem; color: var(--muted); margin-left: auto; }

  .message{
    min-height: 46px;
    display:flex; align-items:center;
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.95rem;
    color: var(--text);
  }
  .message.found{ background: rgba(46,196,182,0.15); color: #0e7c72; font-weight: 600; }
  .message.not-found{ background: rgba(247,37,133,0.1); color: #b3095c; font-weight: 600; }

  .stage{
    overflow-x: auto;
    padding: 30px 4px 10px;
  }
  .array{
    display: flex;
    gap: 6px;
    justify-content: center;
    min-width: max-content;
    margin: 0 auto;
    padding: 0 4px;
  }
  .cell{
    position: relative;
    width: 44px;
    flex: 0 0 auto;
    text-align: center;
  }
  .box{
    height: 44px;
    border-radius: 8px;
    background: var(--box-bg);
    border: 2px solid var(--box-border);
    display:flex; align-items:center; justify-content:center;
    font-weight: 700; font-size: 0.85rem;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
  }
  .idx{
    margin-top: 4px;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .cell.eliminated .box{ background: var(--eliminated); border-color: var(--eliminated); color: var(--eliminated-text); }
  .cell.eliminated .idx{ color: var(--eliminated-text); }
  .cell.mid .box{ background: var(--mid); border-color: var(--mid); color: #3a2a00; transform: scale(1.08); }
  .cell.found .box{ background: var(--found); border-color: var(--found); color: #fff; transform: scale(1.12); }

  .pointer{
    position: absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .pointer.low{ background: var(--low); color: #fff; }
  .pointer.high{ background: var(--high); color: #fff; }
  .pointer.both{ background: var(--text); color: #fff; }

  .legend{ display:flex; flex-wrap:wrap; gap: 14px; font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .swatch{ width: 12px; height: 12px; border-radius: 3px; display:inline-block; }

  footer{ text-align:center; font-size: 0.75rem; color: var(--muted); margin-top: 18px; }
  footer a{ color: var(--accent); }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161f; --panel:#1c1f2b; --border:#2a2e3d; --text:#eef0f6; --muted:#9aa0b4;
      --accent:#7c8cf8; --accent-soft:#232848; --box-bg:#1c1f2b; --box-border:#3a3f56;
      --eliminated:#242736; --eliminated-text:#565c72; color-scheme: dark;
    }
    :root:not([data-theme="light"]) input[type=number]{ background:#1c1f2b; color:#eef0f6; border-color:#3a3f56; }
  }
  :root[data-theme="dark"]{
    --bg:#14161f; --panel:#1c1f2b; --border:#2a2e3d; --text:#eef0f6; --muted:#9aa0b4;
    --accent:#7c8cf8; --accent-soft:#232848; --box-bg:#1c1f2b; --box-border:#3a3f56;
    --eliminated:#242736; --eliminated-text:#565c72; color-scheme: dark;
  }
  :root[data-theme="dark"] input[type=number]{ background:#1c1f2b; color:#eef0f6; border-color:#3a3f56; }

  body{ background: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 Binary Search</h1>
  <p class="subtitle">Schrittweise Animation der binären Suche in einem sortierten Array.</p>

  <div class="panel">
    <div class="controls">
      <div class="field">
        <label for="size">Array-Größe</label>
        <input type="range" id="size" min="5" max="30" value="16">
      </div>
      <button class="btn-secondary" id="regen">🔀 Neues Array</button>
      <div class="field">
        <label for="target">Zielwert</label>
        <input type="number" id="target" value="0">
      </div>
      <button class="btn-primary" id="search">▶ Suche starten</button>
      <div class="field">
        <label for="speed">Geschwindigkeit</label>
        <input type="range" id="speed" min="200" max="2000" step="100" value="900">
      </div>
    </div>

    <div class="playback">
      <button class="btn-ghost" id="restart" title="Zurück zum Anfang">⏮</button>
      <button class="btn-ghost" id="prev" title="Ein Schritt zurück">◀</button>
      <button class="btn-primary" id="play" title="Play/Pause">▶ Play</button>
      <button class="btn-ghost" id="next" title="Ein Schritt vor">▶|</button>
      <span class="step-counter" id="stepCounter">Schritt 0 / 0</span>
    </div>
  </div>

  <div class="panel">
    <div class="stage"><div class="array" id="array"></div></div>
    <div class="message" id="message">Klicke „Suche starten“, um die Animation zu beginnen.</div>
    <div class="legend">
      <span><i class="swatch" style="background:var(--low)"></i> low</span>
      <span><i class="swatch" style="background:var(--high)"></i> high</span>
      <span><i class="swatch" style="background:var(--mid)"></i> mid (Vergleich)</span>
      <span><i class="swatch" style="background:var(--found)"></i> gefunden</span>
      <span><i class="swatch" style="background:var(--eliminated)"></i> ausgeschlossen</span>
    </div>
  </div>

  <footer>Sortier- &amp; Suchalgorithmen-Visualisierungen · <a href="../" target="_top">Alle Animationen</a></footer>
</div>

<script>
(function(){
  const els = {
    size: document.getElementById('size'),
    regen: document.getElementById('regen'),
    target: document.getElementById('target'),
    search: document.getElementById('search'),
    speed: document.getElementById('speed'),
    restart: document.getElementById('restart'),
    prev: document.getElementById('prev'),
    next: document.getElementById('next'),
    play: document.getElementById('play'),
    stepCounter: document.getElementById('stepCounter'),
    array: document.getElementById('array'),
    message: document.getElementById('message'),
  };

  let arr = [];
  let steps = [];
  let current = 0;
  let timer = null;

  function randomSortedArray(n){
    const set = new Set();
    while(set.size < n){
      set.add(Math.floor(Math.random()*100)+1);
    }
    return Array.from(set).sort((a,b)=>a-b);
  }

  function buildSteps(array, target){
    const list = [];
    let low = 0, high = array.length - 1;
    list.push({low, high, mid:null, message:`Start: low=${low} (Wert ${array[low]}), high=${high} (Wert ${array[high]})`, found:false});
    while(low <= high){
      const mid = Math.floor((low+high)/2);
      if(array[mid] === target){
        list.push({low, high, mid, message:`arr[${mid}] = ${array[mid]} = Ziel ${target} → gefunden! 🎉`, found:true, foundIndex:mid});
        low = high + 1;
        break;
      } else if(array[mid] < target){
        list.push({low, high, mid, message:`arr[${mid}] = ${array[mid]} < Ziel ${target} → rechte Hälfte weitersuchen`, found:false});
        low = mid + 1;
      } else {
        list.push({low, high, mid, message:`arr[${mid}] = ${array[mid]} > Ziel ${target} → linke Hälfte weitersuchen`, found:false});
        high = mid - 1;
      }
      if(low <= high){
        list.push({low, high, mid:null, message:`Neuer Suchbereich: low=${low}, high=${high}`, found:false});
      }
    }
    const last = list[list.length-1];
    if(!last.found){
      list.push({low, high, mid:null, message:`low (${low}) > high (${high}) → Ziel ${target} ist nicht im Array vorhanden`, found:false, notFound:true});
    }
    return list;
  }

  function render(){
    els.array.innerHTML = '';
    const step = steps[current] || {low:0, high:arr.length-1, mid:null};
    arr.forEach((val, idx) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const eliminated = idx < step.low || idx > step.high;
      const isMid = idx === step.mid;
      const isFound = step.found && idx === step.foundIndex;
      if(eliminated) cell.classList.add('eliminated');
      if(isMid) cell.classList.add('mid');
      if(isFound) cell.classList.add('found');

      let pointerHtml = '';
      const isLow = idx === step.low && !eliminated;
      const isHigh = idx === step.high && !eliminated;
      if(isLow && isHigh){ pointerHtml = '<span class="pointer both">L/H</span>'; }
      else if(isLow){ pointerHtml = '<span class="pointer low">low</span>'; }
      else if(isHigh){ pointerHtml = '<span class="pointer high">high</span>'; }

      cell.innerHTML = `${pointerHtml}<div class="box">${val}</div><div class="idx">${idx}</div>`;
      els.array.appendChild(cell);
    });

    els.message.textContent = step.message || '';
    els.message.className = 'message' + (step.found ? ' found' : step.notFound ? ' not-found' : '');
    els.stepCounter.textContent = `Schritt ${steps.length ? current+1 : 0} / ${steps.length}`;
    els.prev.disabled = current <= 0;
    els.next.disabled = current >= steps.length - 1;
  }

  function goTo(i){
    current = Math.max(0, Math.min(steps.length-1, i));
    render();
    if(current >= steps.length - 1) stopPlay();
  }

  function stopPlay(){
    clearInterval(timer);
    timer = null;
    els.play.textContent = '▶ Play';
  }

  function togglePlay(){
    if(timer){ stopPlay(); return; }
    if(current >= steps.length - 1) current = 0;
    els.play.textContent = '⏸ Pause';
    timer = setInterval(() => {
      if(current >= steps.length - 1){ stopPlay(); return; }
      current++;
      render();
    }, Number(els.speed.value));
  }

  function newArray(){
    stopPlay();
    const n = Number(els.size.value);
    arr = randomSortedArray(n);
    els.target.value = arr[Math.floor(Math.random()*arr.length)];
    steps = [{low:0, high:arr.length-1, mid:null, message:'Klicke „Suche starten“, um die Animation zu beginnen.'}];
    current = 0;
    render();
  }

  function startSearch(){
    stopPlay();
    const target = Number(els.target.value);
    steps = buildSteps(arr, target);
    current = 0;
    render();
  }

  els.regen.addEventListener('click', newArray);
  els.size.addEventListener('change', newArray);
  els.search.addEventListener('click', startSearch);
  els.play.addEventListener('click', togglePlay);
  els.restart.addEventListener('click', () => goTo(0));
  els.prev.addEventListener('click', () => { stopPlay(); goTo(current-1); });
  els.next.addEventListener('click', () => { stopPlay(); goTo(current+1); });

  newArray();
})();
</script>
</body>
</html>
