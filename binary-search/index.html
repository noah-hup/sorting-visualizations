<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binary Search Animation</title>
<style>
  :root{
    --bg: #ffffff;
    --bar: #111111;
    --bar-active: #b3b3b3;
    --text: #111111;
    --muted: #8a8a8a;
    color-scheme: light;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
  }

  .target{ font-size: 0.85rem; color: var(--muted); }
  .target b{ color: var(--text); }

  .chart{
    display: flex;
    align-items: flex-end;
    gap: 14px;
    height: 200px;
  }
  .bar-wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .bar{
    width: 36px;
    background: var(--bar);
    border-radius: 4px 4px 0 0;
    transition: background 0.3s ease;
  }
  .bar.active{ background: var(--bar-active); }
  .value{ font-size: 0.85rem; font-weight: 600; }

  button{
    border: none;
    background: var(--bar);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 10px 26px;
    border-radius: 999px;
    cursor: pointer;
  }
  button:disabled{ opacity: 0.35; cursor: not-allowed; }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111111; --bar:#f2f2f2; --bar-active:#5a5a5a; --text:#f2f2f2; --muted:#8a8a8a;
      color-scheme: dark;
    }
    :root:not([data-theme="light"]) button{ background: var(--bar); color:#111111; }
  }
  :root[data-theme="dark"]{
    --bg:#111111; --bar:#f2f2f2; --bar-active:#5a5a5a; --text:#f2f2f2; --muted:#8a8a8a;
    color-scheme: dark;
  }
  :root[data-theme="dark"] button{ background: var(--bar); color:#111111; }
</style>
</head>
<body>
  <div class="target">Suche nach <b id="targetLabel"></b></div>
  <div class="chart" id="chart"></div>
  <button id="play">▶ Play</button>

<script>
(function(){
  const arr = [3, 7, 15, 22, 40];
  const target = 7;
  const STEP_MS = 2200;

  const chart = document.getElementById('chart');
  const playBtn = document.getElementById('play');
  document.getElementById('targetLabel').textContent = target;

  const maxVal = Math.max(...arr);
  const maxHeight = 160;

  const bars = arr.map(val => {
    const wrap = document.createElement('div');
    wrap.className = 'bar-wrap';
    const valueLabel = document.createElement('div');
    valueLabel.className = 'value';
    valueLabel.textContent = val;
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = Math.max(20, (val / maxVal) * maxHeight) + 'px';
    wrap.appendChild(valueLabel);
    wrap.appendChild(bar);
    chart.appendChild(wrap);
    return bar;
  });

  function buildMids(array, target){
    const mids = [];
    let low = 0, high = array.length - 1;
    while(low <= high){
      const mid = Math.floor((low+high)/2);
      mids.push(mid);
      if(array[mid] === target) break;
      else if(array[mid] < target) low = mid + 1;
      else high = mid - 1;
    }
    return mids;
  }

  const mids = buildMids(arr, target);
  let playing = false;

  function clearActive(){
    bars.forEach(b => b.classList.remove('active'));
  }

  function play(){
    if(playing) return;
    playing = true;
    playBtn.disabled = true;
    clearActive();

    let i = 0;
    function step(){
      clearActive();
      if(i >= mids.length){
        playing = false;
        playBtn.disabled = false;
        return;
      }
      bars[mids[i]].classList.add('active');
      i++;
      setTimeout(step, STEP_MS);
    }
    step();
  }

  playBtn.addEventListener('click', play);
})();
</script>
</body>
</html>
