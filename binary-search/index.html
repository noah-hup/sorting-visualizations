<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binary Search Animation</title>
<style>
  :root{
    --bg: #ffffff;
    --bar: #111111;
    --bar-active: #b3b3b3;
    --text: #111111;
    --muted: #8a8a8a;
    color-scheme: light;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
  }

  .target{ font-size: 0.85rem; color: var(--muted); }
  .target b{ color: var(--text); }

  .chart{
    display: flex;
    align-items: flex-end;
    gap: 14px;
    height: 200px;
  }
  .bar-wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .bar{
    position: relative;
    width: 36px;
    background: var(--bar);
    border-radius: 4px 4px 0 0;
    transition: background 0.3s ease;
  }
  .bar.active{ background: var(--bar-active); }
  .value{ font-size: 0.85rem; font-weight: 600; }

  .marks{
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    margin-bottom: 4px;
  }
  .mark{
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
    line-height: 1;
    white-space: nowrap;
  }

  button{
    border: none;
    background: var(--bar);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 10px 26px;
    border-radius: 999px;
    cursor: pointer;
  }
  button:disabled{ opacity: 0.35; cursor: not-allowed; }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111111; --bar:#f2f2f2; --bar-active:#5a5a5a; --text:#f2f2f2; --muted:#8a8a8a;
      color-scheme: dark;
    }
    :root:not([data-theme="light"]) button{ background: var(--bar); color:#111111; }
    :root:not([data-theme="light"]) .mark{ color: var(--text); }
  }
  :root[data-theme="dark"]{
    --bg:#111111; --bar:#f2f2f2; --bar-active:#5a5a5a; --text:#f2f2f2; --muted:#8a8a8a;
    color-scheme: dark;
  }
  :root[data-theme="dark"] button{ background: var(--bar); color:#111111; }
</style>
</head>
<body>
  <div class="target">Suche nach <b id="targetLabel"></b></div>
  <div class="chart" id="chart"></div>
  <button id="play">▶ Play</button>

<script>
(function(){
  const arr = [3, 7, 15, 22, 40];
  const target = 7;
  const STEP_MS = 2200;

  const chart = document.getElementById('chart');
  const playBtn = document.getElementById('play');
  document.getElementById('targetLabel').textContent = target;

  const maxVal = Math.max(...arr);
  const maxHeight = 160;

  const bars = arr.map(val => {
    const wrap = document.createElement('div');
    wrap.className = 'bar-wrap';
    const valueLabel = document.createElement('div');
    valueLabel.className = 'value';
    valueLabel.textContent = val;
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = Math.max(20, (val / maxVal) * maxHeight) + 'px';
    const marks = document.createElement('div');
    marks.className = 'marks';
    bar.appendChild(marks);
    wrap.appendChild(valueLabel);
    wrap.appendChild(bar);
    chart.appendChild(wrap);
    return { bar, marks };
  });

  // l + (r-l)/2, gemäß:
  // solange l<=r:
  //   mitte = l + (r-l)/2
  //   gesucht == arr[mitte]  -> gefunden
  //   gesucht <  arr[mitte]  -> rechte Grenze = mitte-1
  //   gesucht >= arr[mitte]  -> linke Grenze  = mitte+1
  function buildSteps(array, target){
    const steps = [];
    let l = 0, r = array.length - 1;
    while(l <= r){
      const mitte = l + Math.floor((r - l) / 2);
      steps.push({ l, r, mitte });
      if(target === array[mitte]) break;
      else if(target < array[mitte]) r = mitte - 1;
      else l = mitte + 1;
    }
    return steps;
  }

  const steps = buildSteps(arr, target);
  let playing = false;

  function render(step){
    bars.forEach(({ bar, marks }, idx) => {
      bar.classList.toggle('active', idx === step.mitte);
      const tags = [];
      if(idx === step.l) tags.push('L');
      if(idx === step.mitte) tags.push('M');
      if(idx === step.r) tags.push('R');
      marks.innerHTML = tags.map(t => `<div class="mark">${t}</div>`).join('');
    });
  }

  function clearAll(){
    bars.forEach(({ bar, marks }) => {
      bar.classList.remove('active');
      marks.innerHTML = '';
    });
  }

  function play(){
    if(playing) return;
    playing = true;
    playBtn.disabled = true;
    clearAll();

    let i = 0;
    function step(){
      if(i >= steps.length){
        playing = false;
        playBtn.disabled = false;
        return;
      }
      render(steps[i]);
      i++;
      setTimeout(step, STEP_MS);
    }
    step();
  }

  playBtn.addEventListener('click', play);
})();
</script>
</body>
</html>
